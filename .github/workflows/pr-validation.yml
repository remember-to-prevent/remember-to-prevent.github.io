name: PR Validation

# Pull-Request-only validation for Remember to Prevent.
#
# SAFETY CONTRACT (2026-10-27 sanitization):
#   - Runs ONLY on pull_requests targeting main. It never runs on push.
#   - Permissions are read-only (`contents: read`) — no Pages, no id-token,
#     no write access of any kind.
#   - It contains NO deployment step and cannot publish anything.
#   - It uses `pull_request` (NOT `pull_request_target`), so untrusted PR
#     code is checked out with the restricted, unprivileged token.
#   - Every mandatory check fails the workflow on error — no
#     continue-on-error, no always-succeed commands.
#
# Production deployment stays exclusively in deploy.yml (push to main).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One validation run per PR; a new push to the branch cancels the stale run.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate: typecheck · lint · data · static export"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (reproducible, from bun.lock)
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Historical-data validation (structure · bilingual · citations · map codes)
        run: bun run validate:data

      # Same base-path computation as deploy.yml, so the PR is validated in
      # exactly the mode production will build it in.
      - name: Compute base path
        id: bp
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export (GitHub Pages mode)
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: ${{ steps.bp.outputs.path }}
        run: bun run build:export

      # Never accept an export we have not verified (same assertions as the
      # deploy workflow's pre-publish gate).
      - name: Verify export output
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html not found — static export failed"
            exit 1
          fi
          echo "out/index.html OK ($(wc -c < out/index.html) bytes)"
          ASSETS=$(find out/_next -type f 2>/dev/null | wc -l)
          echo "Static assets in out/_next: $ASSETS"
          if [ "$ASSETS" -eq 0 ]; then
            echo "::error::No build assets found in out/_next — export incomplete"
            exit 1
          fi
          if [ ! -f out/favicon.svg ]; then
            echo "::error::out/favicon.svg missing — public/ folder not copied into export"
            exit 1
          fi
          echo "Export contents:"
          ls out
