name: Validate and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages deployment permissions (official actions pattern)
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new push cancels the in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Integrity gate — install from the lockfile and lint.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # 2) Static export. This repository is an organization root site
  #    (remember-to-prevent.github.io), so the site is served at "/" and the
  #    computed base path stays empty; project sites would get /REPO_NAME.
  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Compute base path
        id: bp
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static export
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: ${{ steps.bp.outputs.path }}
        run: bun run build:export
      # Never publish an artifact we have not verified: the export must
      # contain a real homepage and the built CSS/JS assets.
      - name: Verify export output
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html not found — static export failed"
            exit 1
          fi
          echo "out/index.html OK ($(wc -c < out/index.html) bytes)"
          ASSETS=$(find out/_next -type f 2>/dev/null | wc -l)
          echo "Static assets in out/_next: $ASSETS"
          if [ "$ASSETS" -eq 0 ]; then
            echo "::error::No build assets found in out/_next — export incomplete"
            exit 1
          fi
          if [ ! -f out/favicon.svg ]; then
            echo "::error::out/favicon.svg missing — public/ folder not copied into export"
            exit 1
          fi
          echo "Export contents:"
          ls out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # 3) Publish to GitHub Pages.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
